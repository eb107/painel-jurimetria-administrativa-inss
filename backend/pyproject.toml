[project]
name = "jurimetria-backend"
version = "0.1.0"
description = "Backend do Painel de Jurimetria Administrativa"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "openpyxl>=3.1.5",
    "python-dateutil>=2.9.0.post0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]
